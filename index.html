<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b111b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>AOI Finder</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f8ff;background:#0b111b}*{box-sizing:border-box}body{margin:0}.app{height:100dvh;min-height:420px;display:grid;grid-template-rows:74px 1fr 1fr;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);gap:14px}.top{display:flex;justify-content:center;align-items:center;border-bottom:1px solid #263244;position:relative}.top b{position:absolute;left:0;font-size:14px;letter-spacing:.12em;color:#9fb2cb}.gear{border:0;background:transparent;color:white;font-size:29px;padding:10px;cursor:pointer}.panel{background:#141e2b;border:1px solid #263449;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;min-height:0}.label{font-size:12px;letter-spacing:.16em;color:#9db0c8;margin-bottom:22px;text-align:center}input{font:inherit;background:#0c1521;color:white;border:1px solid #3d536d;border-radius:14px;padding:17px;width:100%;max-width:480px;text-align:center;font-size:25px;outline:none}input:focus{border-color:#50bdf8}.position{font-size:clamp(34px,9vw,70px);font-weight:800;color:#65ceff;text-align:center;overflow-wrap:anywhere}.hint{color:#9fb0c8;text-align:center;font-size:15px;margin-top:14px}.modal{position:fixed;inset:0;background:#050911dc;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.dialog{width:100%;max-width:460px;background:#172231;border:1px solid #34465d;border-radius:22px;padding:22px}.dialog h2{margin:0 0 20px}.actions{display:flex;gap:12px;margin-bottom:18px}button.action{flex:1;border:1px solid #42546a;border-radius:13px;background:#223246;color:white;font-size:23px;padding:12px;cursor:pointer}button.action.active{background:#135e85;border-color:#58caff}.dialog input{font-size:18px;margin-bottom:12px}.buttons{display:flex;gap:10px}.buttons button{flex:1;padding:14px;border:0;border-radius:12px;background:#37a9e6;color:#07111c;font-weight:750;font-size:15px}.buttons button.secondary{background:#334359;color:white}.status{min-height:22px;color:#a8c8dc;font-size:14px;margin:8px 0 12px;text-align:center}</style></head><body><main class="app"><header class="top"><b>AOI FINDER</b><button class="gear" id="settings" aria-label="Instellingen">⚙</button></header><section class="panel"><div class="label">COMPONENTNUMMER</div><input id="lookup" type="text" placeholder="Typ componentnummer" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Componentnummer"></section><section class="panel" aria-live="polite"><div class="label">POSITIE</div><div id="position" class="position">—</div><div id="hint" class="hint">Voer een componentnummer in</div></section></main><div class="modal" id="modal" hidden><div class="dialog"><h2>Componenten beheren</h2><div class="actions"><button class="action active" id="addTab">+ Toevoegen</button><button class="action" id="deleteTab">− Verwijderen</button></div><input id="component" placeholder="Componentnummer" autocomplete="off" autocapitalize="characters" spellcheck="false"><input id="slot" placeholder="Positie" autocomplete="off"><div class="status" id="status"></div><div class="buttons"><button class="secondary" id="close">Sluiten</button><button id="save">Toevoegen</button></div></div></div><script>const KEY='aoi-finder-v1';let db={};try{const stored=JSON.parse(localStorage.getItem(KEY)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))db=stored}catch{}const $=id=>document.getElementById(id);let mode='add';function norm(s){return s.trim().toUpperCase()}function refresh(){const n=norm($('lookup').value);$('position').textContent=n?(db[n]||'—'):'—';$('hint').textContent=!n?'Voer een componentnummer in':db[n]?'Component gevonden':'Component niet gevonden'}$('lookup').addEventListener('input',refresh);function showMode(next){mode=next;$('addTab').classList.toggle('active',mode==='add');$('deleteTab').classList.toggle('active',mode==='delete');$('slot').hidden=mode==='delete';$('save').textContent=mode==='add'?'Toevoegen':'Verwijderen';$('status').textContent='';$('component').value='';$('slot').value=''}$('settings').addEventListener('click',()=>{$('modal').hidden=false;showMode('add');$('component').focus()});$('close').onclick=()=>$('modal').hidden=true;document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true});$('addTab').onclick=()=>showMode('add');$('deleteTab').onclick=()=>showMode('delete');$('component').addEventListener('input',()=>{if(mode==='delete')$('status').textContent=db[norm($('component').value)]?'Positie: '+db[norm($('component').value)]:'Niet gevonden'});$('save').onclick=()=>{const n=norm($('component').value),p=$('slot').value.trim();if(!n){$('status').textContent='Vul een componentnummer in';return}if(mode==='add'){if(!p){$('status').textContent='Vul een positie in';return}if(db[n]&&!confirm('Deze component bestaat al. Positie vervangen?'))return;const next={...db,[n]:p};try{localStorage.setItem(KEY,JSON.stringify(next));db=next}catch{$('status').textContent='Opslaan mislukt: opslag niet beschikbaar';return}$('status').textContent='Component opgeslagen'}else{if(!db[n]){$('status').textContent='Component niet gevonden';return}if(!confirm('Component '+n+' verwijderen?'))return;const next={...db};delete next[n];try{localStorage.setItem(KEY,JSON.stringify(next));db=next}catch{$('status').textContent='Opslaan mislukt: opslag niet beschikbaar';return}$('status').textContent='Component verwijderd'}$('component').value='';$('slot').value='';refresh()};if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});refresh();</script></body></html>
