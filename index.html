<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07101f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Component Finder</title><style>
:root{color-scheme:dark;--bg:#060b15;--panel:#101b2e;--line:#263b58;--blue:#37baff;--text:#e9f4ff;--muted:#8ba4c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#18345d 0%,#060b15 57%);font-family:system-ui,-apple-system,sans-serif;color:var(--text);min-height:100dvh}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--blue)}.app{max-width:540px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{height:92px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--blue);font-weight:800}.brand{font-size:23px;font-weight:850;letter-spacing:-.04em}.gear{width:49px;height:49px;background:#12233b;color:#b8eaff;border:1px solid #335575;border-radius:16px;font-size:26px}.main{display:flex;flex-direction:column;flex:1;gap:16px;padding:22px 0}.card{background:linear-gradient(155deg,#14243b,#0d1626);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 38px #0003}.label{color:var(--muted);font-size:12px;letter-spacing:.14em;font-weight:750}.entry{margin:18px 0 16px;min-height:72px;display:flex;align-items:center;justify-content:center;border:1px solid #37628a;background:#071321;border-radius:15px;font-size:35px;font-weight:800;letter-spacing:.06em;color:#f1f9ff;overflow:hidden}.entry.empty{color:#4c6887}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{border:1px solid #294362;border-radius:13px;background:#17283f;color:white;height:55px;font-size:24px;font-weight:700;touch-action:manipulation}.key:active{background:#245d8e}.key.alt{font-size:19px;color:#94cfff}.key.enter{background:#0e76b5;border-color:#33baff;font-size:17px}.result{flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:13px}.result-value{font-size:clamp(35px,11vw,62px);font-weight:900;color:var(--blue);letter-spacing:.025em;word-break:break-all}.status{font-size:12px;color:#7f9ab8}.result.missing .result-value{color:#ff697b;font-size:30px}.result.found .status{color:#72dbac}footer{padding:12px 0 18px;text-align:center;color:#66819f;font-size:11px}.overlay{position:fixed;inset:0;background:#020711e8;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.overlay.show{display:flex}.modal{background:#101d30;border:1px solid #355271;border-radius:22px;padding:22px;width:min(100%,460px);max-height:90dvh;overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.modal h2{margin:0;font-size:22px}.close{background:transparent;border:0;color:white;font-size:28px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{padding:17px 8px;background:#152d49;border:1px solid #38638a;border-radius:14px;color:#e9f4ff;font-weight:750}.action.active{background:#09699e}.field{display:block;font-size:12px;color:#a9bfd7;margin:16px 0 7px}.modal input{width:100%;height:49px;border:1px solid #355474;background:#081321;color:white;border-radius:11px;font-size:18px;padding:0 13px}.primary{width:100%;margin-top:18px;height:50px;background:#087cbe;color:white;border:0;border-radius:12px;font-weight:800}.danger{background:#a72d4a}.message{min-height:22px;color:#91d8ff;margin-top:13px;font-size:13px}.small{font-size:12px;color:#91a7bf;line-height:1.6}.secondary{margin-top:14px;background:#1b304a;color:#d6eaff;border:1px solid #365a7b;border-radius:11px;padding:12px;width:100%}.hidden{display:none!important}</style></head><body><div class="app"><header><div><div class="eyebrow">STOCK LOCATION SYSTEM</div><div class="brand">Component <span style="color:var(--blue)">Finder</span></div></div><button class="gear" id="settings" aria-label="Beheer openen">⚙</button></header><main class="main"><section class="card"><div class="label">PRODUCTNUMMER</div><div class="entry empty" id="display">—</div><div class="pad" id="pad"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key alt" data-key="clear">C</button><button class="key" data-key="0">0</button><button class="key alt" data-key="back">⌫</button></div><button class="primary" id="enter">ENTER ↵</button></section><section class="card result" id="result"><div class="label">STOCK LOCATION</div><div class="result-value" id="position">—</div><div class="status" id="status">Voer een productnummer in</div></section></main><footer>OFFLINE READY · LOKAAL OPGESLAGEN</footer></div>
<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">Beheer</h2><button class="close" id="close" aria-label="Sluiten">×</button></div><div class="actions"><button class="action active" id="addTab">＋ Toevoegen</button><button class="action" id="delTab">− Verwijderen</button></div><label class="field" for="manageNum">PRODUCTNUMMER</label><input id="manageNum" inputmode="numeric" autocomplete="off" placeholder="Bijv. 56277"><div id="positionWrap"><label class="field" for="managePos">STOCK LOCATION</label><input id="managePos" autocomplete="off" autocapitalize="characters" placeholder="Bijv. 2562C"></div><button class="primary" id="save">Component opslaan</button><div class="message" id="message" role="status"></div><hr style="border:0;border-top:1px solid #2a405d;margin:22px 0"><div class="label">DATABASE</div><p class="small" id="count"></p><button class="secondary" id="importBtn">Importeer CSV-bestand</button><button class="secondary" id="exportBtn">Exporteer back-up (CSV)</button><input class="hidden" type="file" id="file" accept=".csv,text/csv,text/plain"><p class="small">Importformaat: productnummer,stocklocatie. Bestaande nummers worden bijgewerkt. Controleer de gegevens voor gebruik.</p></section></div>
<script>
(()=>{'use strict';const KEY='component-finder-v2';const $=id=>document.getElementById(id);let db={};try{let d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d&&typeof d==='object'&&!Array.isArray(d))db=d}catch(e){}let digits='',mode='add';const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Opslaan mislukt. Controleer de opslagruimte.');return false}};const count=()=>{$('count').textContent=Object.keys(db).length+' component(en) lokaal opgeslagen'};const update=()=>{$('display').textContent=digits||'—';$('display').classList.toggle('empty',!digits);$('position').textContent='—';$('status').textContent=digits?'Druk op ENTER om te zoeken':'Voer een productnummer in';$('result').className='card result'};const lookup=()=>{if(!digits)return;let pos=db[digits];if(pos){$('position').textContent=pos;$('status').textContent='✓ COMPONENT GEVONDEN';$('result').className='card result found'}else{$('position').textContent='NIET GEVONDEN';$('status').textContent='Controleer nummer of voeg toe via ⚙';$('result').className='card result missing'}};$('pad').addEventListener('click',e=>{let k=e.target.closest('[data-key]')?.dataset.key;if(!k)return;if(k==='clear')digits='';else if(k==='back')digits=digits.slice(0,-1);else if(digits.length<24)digits+=k;update()});$('enter').onclick=lookup;$('settings').onclick=()=>{$('overlay').classList.add('show');count()};$('close').onclick=()=>{$('overlay').classList.remove('show');$('message').textContent=''};$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('close').click()});const tab=m=>{mode=m;$('addTab').classList.toggle('active',m==='add');$('delTab').classList.toggle('active',m==='del');$('positionWrap').classList.toggle('hidden',m==='del');$('save').textContent=m==='add'?'Component opslaan':'Component verwijderen';$('save').classList.toggle('danger',m==='del');$('message').textContent=''};$('addTab').onclick=()=>tab('add');$('delTab').onclick=()=>tab('del');$('save').onclick=()=>{const num=$('manageNum').value.trim(),pos=$('managePos').value.trim().toUpperCase();if(!/^\d+$/.test(num)){$('message').textContent='Vul een geldig numeriek productnummer in.';return}if(mode==='add'){if(!pos){$('message').textContent='Vul een stocklocatie in.';return}if(db[num]&&db[num]!==pos&&!confirm('Bestaande positie '+db[num]+' vervangen door '+pos+'?'))return;db[num]=pos;if(!persist())return;$('message').textContent='✓ '+num+' opgeslagen op '+pos}else{if(!db[num]){$('message').textContent='Productnummer niet gevonden.';return}if(!confirm('Product '+num+' verwijderen?'))return;delete db[num];if(!persist())return;$('message').textContent='✓ Product verwijderd'}count()};$('exportBtn').onclick=()=>{const rows=[['productnummer','stocklocatie'],...Object.entries(db).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}))];const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='component-finder-backup.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const text=await f.text();const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());let n=0,bad=0;const incoming={};for(const line of lines){const match=line.match(/^\s*"?([^",;]+)"?\s*[,;]\s*"?([^",;]+)"?\s*$/);if(!match){bad++;continue}let num=match[1].trim(),pos=match[2].trim().toUpperCase();if(num.toLowerCase()==='productnummer')continue;if(!/^\d+$/.test(num)||!pos){bad++;continue}incoming[num]=pos;n++}if(!n){$('message').textContent='Geen geldige regels gevonden.';return}if(!confirm(n+' regels importeren? Bestaande productnummers worden bijgewerkt.'))return;Object.assign(db,incoming);if(persist()){$('message').textContent='✓ '+n+' regels geïmporteerd'+(bad?' · '+bad+' overgeslagen':'');count()}e.target.value=''};if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});update()})();
</script></body></html>
